[project]
name = "wa-bridge"
version = "0.1.0"
description = "OpenWA to Chatwoot API inbox bridge for the Copiloto WhatsApp demo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "faster-whisper>=1.2.1",
    "av==13.1.0",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wa_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
