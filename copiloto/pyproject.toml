[project]
name = "copiloto"
version = "0.1.0"
description = "Copiloto de Recepción: middleware entre Chatwoot y el PMS para Hotel Boutique Bordeluz"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "PyYAML>=6,<7", "httpx>=0.27,<1", "tzdata>=2025.1"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copiloto"]
include = ["src/copiloto/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
