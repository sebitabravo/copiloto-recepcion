# Inventario de PRUEBA que recepción consulta desde la bandeja (no es un PMS real ni una reserva).
# Fuera de la ventana el cupo es desconocido: la bandeja lo dice y recepción responde con un seguimiento
# honesto. `occupied` resta unidades por noche; así 20-22 nov deja 1 doble libre para el caso canónico.
test_inventory:
  label: "Inventario de prueba (ficticio)"
  window: {from: 2026-11-01, to: 2027-03-31}
  units: {doble: 3, twin: 2, familiar: 1}
  nightly_price_clp: {doble: 58000, twin: 54000, familiar: 89000}
  occupied:
    - {date: 2026-11-20, doble: 2, twin: 2, familiar: 1}
    - {date: 2026-11-21, doble: 2, twin: 2, familiar: 1}
