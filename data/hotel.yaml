# FAQ aprobadas. `keywords` alimentan el reconocimiento determinista del bot (sin LLM).
faqs:
  - id: piscina
    label: Piscina
    keywords: [piscina, pileta, nadar, temperada]
    answer: "Tenemos piscina temperada, disponible durante todo el año y incluida en tu estadía."
    source: https://www.hotelbordeluz.cl/servicios
    status: verificado
  - id: tinajas
    label: Tinajas calientes
    keywords: [tinaja, tinajas, jacuzzi, hidromasaje, agua caliente]
    answer: "Contamos con tinajas de agua caliente, para usar de día o de noche. Tienen un valor adicional que te confirma recepción."
    source: https://www.hotelbordeluz.cl/servicios
    status: verificado
  - id: desayuno
    label: Desayuno
    keywords: [desayuno, desayunar, buffet, buffete, comida, comedor]
    answer: "Todas las habitaciones incluyen desayuno continental (buffet en temporada alta), en un comedor con vista al lago."
    source: https://www.hotelbordeluz.cl/servicios
    status: verificado
  - id: checkin
    label: Horarios de check-in y check-out
    keywords: [check-in, checkin, check in, check-out, checkout, check out, horario de ingreso, hora de llegada, hora de salida, a que hora]
    answer: "El check-in es desde las 15:00 y el check-out hasta las 12:00. Early check-in o late check-out dependen de disponibilidad y tienen costo."
    source: términos y condiciones (PDF del sitio)
    status: verificado
  - id: cancelacion
    label: Cancelación
    keywords: [cancelar, cancelacion, cancelación, anular, penalidad, reembolso, devolucion]
    answer: "En temporada baja no hay penalidad si cancelas con 7 días o más; en temporada alta (15 dic - 1 mar), con 15 días o más. Después se cobran noches de penalidad. Recepción te detalla tu caso."
    source: términos y condiciones (PDF del sitio)
    status: verificado
  - id: ninos
    label: Niños y camas adicionales
    keywords: [niño, niños, nino, ninos, bebe, bebé, cuna, cama adicional, hijos, familia]
    answer: "Menores de 2 años se alojan gratis en cuna y menores de 6 años gratis en las camas existentes, con desayuno. Un niño mayor o adulto extra en cama adicional cuesta $25.000 por noche. Las camas adicionales se piden y las confirma el hotel."
    source: términos y condiciones (PDF del sitio)
    status: verificado
  - id: pago
    label: Pago y garantía
    keywords: [pago, pagar, tarjeta, abono, garantia, garantía, deposito, depósito, transferencia]
    answer: "La reserva se confirma con un abono del 50% y los datos de una tarjeta de crédito en garantía. Aceptamos American Express, Visa y Mastercard."
    source: términos y condiciones (PDF del sitio)
    status: verificado
  - id: estadia_minima
    label: Estadía mínima
    keywords: [estadia minima, estadía mínima, minimo de noches, mínimo de noches, minimo noches]
    answer: "En temporada alta (segunda quincena de diciembre, enero, febrero y mitad de marzo) la estadía mínima es de 3 noches."
    source: términos y condiciones (PDF del sitio)
    status: verificado
  - id: estacionamiento
    label: Estacionamiento
    keywords: [estacionamiento, parking, auto, vehiculo, vehículo, aparcar]
    answer: "Las habitaciones cuentan con estacionamiento."
    source: https://www.hotelbordeluz.cl/habitaciones
    status: verificado
  - id: wifi
    label: WiFi y climatización
    keywords: [wifi, wi-fi, internet, aire acondicionado, calefaccion, calefacción]
    answer: "Las habitaciones tienen WiFi, aire acondicionado y calefacción, baño privado en suite y televisor."
    source: https://www.hotelbordeluz.cl/habitaciones
    status: verificado
  - id: promociones
    label: Promociones
    keywords: [promocion, promoción, promociones, oferta, ofertas, paquete, termas, descuento]
    answer: "Hoy publicamos: 3 días 2 noches para dos + 1 día de Termas Trancura ($99.500), con Termas Montevivo ($94.500) y la Escapada Romántica ($140.000, hasta el 30-dic-2026). Recepción confirma vigencia y cupos."
    source: https://www.hotelbordeluz.cl/promociones
    status: verificado
  - id: restaurante
    label: Restaurante
    keywords: [restaurante, restaurant, almuerzo, cena, domingo]
    answer: "Hay restaurante a pasos del hotel. Los días y horarios de atención los confirma recepción."
    source: https://www.hotelbordeluz.cl/contacto
    status: pendiente_validar
    status_note: "Una reseña de 2025 indica restaurante cerrado los domingos; no confirmado por el hotel."
  - id: mascotas
    label: Mascotas
    keywords: [mascota, mascotas, perro, perros, gato, gatos, pet]
    answer: "La política de mascotas no está publicada en nuestro sitio. Recepción te confirma si es posible."
    source: "No publicado en el sitio ni en los términos"
    status: pendiente_validar
  - id: recepcion_horario
    label: Horario de recepción
    keywords: [recepcion 24, recepción 24, horario de recepcion, horario de recepción, atienden de noche]
    answer: "El equipo de recepción responde mensajes en su horario de turno. Si escribes fuera de horario, dejamos tu consulta registrada para que la vean al comenzar."
    source: "Conflicto: agregadores dicen recepción 24 h; entrevista E1 indica consultas nocturnas sin respuesta"
    status: pendiente_validar

