name: copiloto

x-chatwoot-env: &chatwoot-env
  RAILS_ENV: production
  NODE_ENV: production
  INSTALLATION_ENV: docker
  SECRET_KEY_BASE: ${SECRET_KEY_BASE}
  FRONTEND_URL: http://localhost:3000
  FORCE_SSL: "false"
  ENABLE_ACCOUNT_SIGNUP: "false"
  POSTGRES_HOST: postgres
  POSTGRES_DATABASE: chatwoot
  POSTGRES_USERNAME: postgres
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  REDIS_URL: redis://redis:6379
  RAILS_LOG_TO_STDOUT: "true"
  LOG_LEVEL: info
  RAILS_MAX_THREADS: "3"
  WEB_CONCURRENCY: "1"
  SIDEKIQ_CONCURRENCY: "${SIDEKIQ_CONCURRENCY:-2}"
  MAILER_SENDER_EMAIL: Copiloto <no-reply@localhost>
  DEFAULT_LOCALE: es
  SAFE_FETCH_ALLOW_PRIVATE_NETWORK: "true"

services:
  postgres:
    profiles: ["full"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatwoot"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    profiles: ["full"]
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  chatwoot:
    profiles: ["full"]
    image: chatwoot/chatwoot:v4.18.0-ce
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    environment: *chatwoot-env
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - chatwoot_storage:/app/storage
      - ./infra/bootstrap:/bootstrap:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    restart: unless-stopped

  sidekiq:
    profiles: ["full"]
    image: chatwoot/chatwoot:v4.18.0-ce
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    environment: *chatwoot-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - chatwoot_storage:/app/storage
    restart: unless-stopped

  pms-mock:
    build: ./pms_mock
    environment:
      HOTEL_DATA_PATH: /app/data/hotel.yaml
      PMS_DB_PATH: /var/lib/pms/pms.sqlite
      STAFF_TOKEN: ${STAFF_TOKEN}
      DEMO_MODE: ${DEMO_ENABLED:-1}
      COPILOTO_EVENTS_URL: http://copiloto:8100/webhooks/pms
      COPILOTO_EVENTS_TOKEN: ${PMS_EVENTS_SECRET}
      SIMULATE_DOWN: ${SIMULATE_DOWN:-0}
    volumes:
      - ./data:/app/data:ro
      - pms_state:/var/lib/pms
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8200:8200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8200/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Puente Beds24 → contrato del copiloto. Solo se levanta con `--profile beds24`: el stack de la
  # demo no lo necesita. Ver docs/conector-pms.md.
  beds24-bridge:
    profiles: ["beds24"]
    build: ./pms_bridge
    environment:
      BEDS24_ACCESS_TOKEN: ${BEDS24_ACCESS_TOKEN:-}
      BEDS24_REFRESH_TOKEN: ${BEDS24_REFRESH_TOKEN:-}
      BEDS24_ROOMS: ${BEDS24_ROOMS:-[]}
      BEDS24_CLP_RATE: ${BEDS24_CLP_RATE:-1}
      BEDS24_TZ: ${TIMEZONE:-America/Santiago}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8300:8300"
    restart: unless-stopped

  copiloto:
    build: ./copiloto
    env_file:
      - path: ./.env.runtime
        required: false
    environment:
      COPILOTO_ENV: production
      HOTEL_DATA_PATH: /app/data/hotel.yaml
      COPILOTO_DB_PATH: /var/lib/copiloto/copiloto.sqlite
      CHATWOOT_URL: http://chatwoot:3000
      CHATWOOT_PUBLIC_URL: ${CHATWOOT_PUBLIC_URL:-http://localhost:3000}
      COPILOTO_PUBLIC_URL: ${COPILOTO_PUBLIC_URL:-http://localhost:8100}
      PMS_URL: http://pms-mock:8200
      PMS_STAFF_URL: http://localhost:8200
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      PMS_EVENTS_SECRET: ${PMS_EVENTS_SECRET}
      PSEUDONYM_SALT: ${PSEUDONYM_SALT}
      PANEL_TOKEN: ${PANEL_TOKEN}
      AI_MODE: ${AI_MODE:-assisted}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-25}
      AI_TURN_TIMEOUT_S: ${AI_TURN_TIMEOUT_S:-12}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_VOICE_ID_EN: ${ELEVENLABS_VOICE_ID_EN:-}
      PIPER_MODEL_PATH: ${PIPER_MODEL_PATH:-}
      PIPER_CONFIG_PATH: ${PIPER_CONFIG_PATH:-}
      ELEVENLABS_MODEL: ${ELEVENLABS_MODEL:-eleven_flash_v2_5}
      VOICE_CHARS_PER_HOUR: ${VOICE_CHARS_PER_HOUR:-20000}
      VOICE_CHARS_PER_MONTH: ${VOICE_CHARS_PER_MONTH:-30000}
      PMS_STAFF_TOKEN: ${STAFF_TOKEN}
      DEMO_ENABLED: ${DEMO_ENABLED:-1}
      LANDING_ORIGIN: ${LANDING_ORIGIN:-http://localhost:8080}
      SHIFT_START: ${SHIFT_START:-08:00}
      SHIFT_END: ${SHIFT_END:-22:00}
      FIXED_MONTHLY_CLP: ${FIXED_MONTHLY_CLP:-90000}
      # Perillas documentadas (docs/consentimiento-y-retencion.md y docs/ia.md): en blanco cuentan como
      # sin configurar y Settings usa sus valores por defecto (90 / 15).
      RETENTION_DAYS: ${RETENTION_DAYS:-}
      PREBOOKING_MINUTES: ${PREBOOKING_MINUTES:-}
    volumes:
      - ./data:/app/data:ro
      - copiloto_state:/var/lib/copiloto
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8100:8100"
    depends_on:
      pms-mock: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Canal de WhatsApp de la demo. Solo con `--profile whatsapp` (make wa-up): usa OpenWA, un gateway NO oficial
  # (WhatsApp Web automatizado). Pensado para un número dedicado de demo; ver docs/whatsapp-demo.md.
  openwa:
    profiles: ["whatsapp"]
    image: ghcr.io/rmyndharis/openwa:0.27.1@sha256:1a2d0c393a7c8a629b0b18cdb5125d9be59192480c02d56a022c249a66af9068
    environment:
      NODE_ENV: production
      DATABASE_TYPE: sqlite
      API_MASTER_KEY: ${OPENWA_API_KEY}
      AUTO_START_SESSIONS: "true"
      # El panel se sirve por HTTP plano en localhost: sin esto el navegador lo sube a https y queda en blanco
      CSP_UPGRADE_INSECURE_REQUESTS: "false"
      # El destino es el puente, dentro de la red interna de Docker
      WEBHOOK_SSRF_PROTECT: "false"
      WEBHOOK_URL: http://wa-bridge:8400/webhooks/openwa
      WEBHOOK_SECRET: ${OPENWA_WEBHOOK_SECRET}
    volumes:
      - openwa_data:/app/data
    # Sin cap_drop: el entrypoint de la imagen hace chown/cambio de usuario y falla sin esas capacidades
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:2785:2785"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:2785/api/health', r => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Puente OpenWA <-> inbox API de Chatwoot. Reutiliza .env.runtime (lo escribe el seed).
  wa-bridge:
    profiles: ["whatsapp"]
    build: ./wa_bridge
    env_file:
      - path: ./.env.runtime
        required: false
    environment:
      OPENWA_API_URL: http://openwa:2785
      OPENWA_API_KEY: ${OPENWA_API_KEY}
      OPENWA_WEBHOOK_SECRET: ${OPENWA_WEBHOOK_SECRET}
      CHATWOOT_URL: http://chatwoot:3000
      WA_BRIDGE_DB_PATH: /var/lib/wa-bridge/bridge.sqlite
      # Notas de voz: transcripción local con Whisper. El audio se borra al terminar (ver docs/consentimiento-y-retencion.md)
      VOICE_NOTES: ${VOICE_NOTES:-0}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_CACHE_DIR: /var/lib/wa-bridge/models
    volumes:
      - wa_bridge_state:/var/lib/wa-bridge
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8400/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  landing:
    image: nginx:alpine
    environment:
      # URL pública de la portada: canónicos, Open Graph, JSON-LD, robots.txt y sitemap.xml (sin barra final)
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:8080}
      # Servicio que atiende /privacidad en la misma origen de la portada
      COPILOTO_UPSTREAM: ${COPILOTO_UPSTREAM:-http://copiloto:8100}
      # envsubst solo toca estas dos: las variables propias de Nginx quedan intactas
      NGINX_ENVSUBST_FILTER: ^(PUBLIC_SITE_URL|COPILOTO_UPSTREAM)$$
    volumes:
      - ./landing:/usr/share/nginx/html:ro
      # Plantilla: la imagen oficial la pasa por envsubst a /etc/nginx/conf.d/default.conf al arrancar
      - ./infra/landing/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8080:80"
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  chatwoot_storage:
  pms_state:
  copiloto_state:
  openwa_data:
  wa_bridge_state:
