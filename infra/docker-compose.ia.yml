# Perfil de IA local para la demo: servidor llama.cpp en la GPU NVIDIA, sin API pagada.
# Se combina con el compose base:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.ia.yml up -d
# Sin GPU NVIDIA, agrega encima infra/docker-compose.ia-cpu.yml (./scripts/demo.sh ia lo decide solo).
# El modelo se descarga la primera vez dentro del volumen `llm_models` (~2,5 GB).
#
# Por qué este modelo y estas banderas: docs/ia-local.md («Elección del modelo»).

services:
  llm:
    # Etiqueta fija: las móviles (`server-cuda`) cambian cada noche. CUDA 12.8, necesario para Blackwell (RTX 50xx).
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b12169
    command:
      - -hf
      - unsloth/Qwen3-4B-Instruct-2507-GGUF:Q4_K_M
      - --alias
      - qwen3-4b-instruct-2507
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c
      - "8192"
      - --parallel
      - "1"
      # Todas las capas en la GPU: el modelo ocupa ~2,5 GB y el caché de 8k tokens ~1,2 GB.
      - -ngl
      - "99"
      - --jinja
      # Modelo sin razonamiento: ninguna etiqueta <think> puede colarse en la respuesta ni en las herramientas.
      - --reasoning
      - "off"
      # Reutiliza el prefijo común (prompt de sistema + herramientas) entre turnos.
      - --cache-reuse
      - "256"
      # Muestreo de la model card de Qwen3-4B-Instruct-2507; la temperatura la manda el copiloto (LLM_TEMPERATURE).
      - --top-k
      - "20"
      - --top-p
      - "0.8"
      - --min-p
      - "0"
      - --no-webui
    environment:
      LLAMA_CACHE: /models
    volumes:
      - llm_models:/models
    ports:
      - "127.0.0.1:11434:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  copiloto:
    environment:
      # Basta una clave no vacía: el servidor local no la valida, el copiloto la exige para activar la IA.
      LLM_API_KEY: local
      LLM_BASE_URL: http://llm:8080/v1
      LLM_MODEL: qwen3-4b-instruct-2507
      LLM_TIMEOUT_S: "30"
      AI_TURN_TIMEOUT_S: "25"
      # Temperatura baja: el asistente repite los datos de las herramientas en vez de improvisar.
      LLM_TEMPERATURE: "0.2"

volumes:
  llm_models:
