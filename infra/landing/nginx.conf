server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El CSS y el JS pesan 85 KB sin comprimir y Nginx no comprime por defecto más allá del HTML.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # config.js lleva el token del widget de Chatwoot: no debe quedar en caché.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
