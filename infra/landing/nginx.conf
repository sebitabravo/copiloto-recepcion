server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Seguridad básica para todas las respuestas. Ojo: un add_header propio en un location deja
    # sin heredar estos del server, por eso config.js, /index.html y las fuentes los repiten.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # El CSS y el JS pesan 85 KB sin comprimir y Nginx no comprime por defecto más allá del HTML.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # config.js lleva el token del widget de Chatwoot: no debe quedar en caché.
    location = /config.js {
        add_header Cache-Control "no-store";
        # Un add_header propio deja sin heredar los del server: se repiten aquí.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # El HTML siempre revalidado: cubre "/" (el índice redirige internamente a /index.html).
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Las fuentes no cambian, pero sus nombres no llevan huella de contenido: una semana
    # con revalidación, nunca "immutable" (una actualización quedaría congelada un año).
    location ~* \.woff2$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
