# Plantilla de Nginx para la portada (/) y el simulador (/demo).
# La imagen oficial la procesa con envsubst al arrancar (/etc/nginx/templates → conf.d/default.conf).
# Solo se sustituyen PUBLIC_SITE_URL y COPILOTO_UPSTREAM (NGINX_ENVSUBST_FILTER en el compose):
# las variables propias de Nginx (con signo de dólar) quedan intactas.

# Una sola política de caché decidida por la URL pedida, para no repetir add_header por location
# (un add_header dentro de un location deja sin heredar los del server).
map $request_uri $landing_cache_control {
    default                                          "no-cache";
    # config.js lleva el token del widget de Chatwoot y lo regenera el seed: nunca en caché.
    ~^/config\.js                                    "no-store";
    # Las fuentes no cambian de contenido: un año, inmutables.
    ~*^/fonts/[^?]+\.woff2                           "public, max-age=31536000, immutable";
    # Recursos versionados con ?v=: el HTML cambia la versión cuando cambia el archivo.
    ~*^/[^?]+\.(css|js|svg|png|webp|ico)\?(.*&)?v=   "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;
    charset_types text/css application/javascript text/plain text/xml application/xml image/svg+xml;

    # Seguridad y caché para todas las respuestas, incluidos los errores.
    add_header Cache-Control $landing_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # El micrófono queda solo para esta origen: la demo de voz lo pide en /demo.
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=(), usb=()" always;

    # El CSS y el JS pesan unos 85 KB sin comprimir; el HTML se comprime siempre.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json
               application/ld+json application/xml image/svg+xml;

    # URL pública: el HTML, robots.txt y sitemap.xml llevan el marcador __PUBLIC_SITE_URL__ y Nginx lo
    # reemplaza al servir (canónicos, Open Graph, JSON-LD, sitemap). Se fija con PUBLIC_SITE_URL.
    sub_filter "__PUBLIC_SITE_URL__" "${PUBLIC_SITE_URL}";
    sub_filter_once off;
    sub_filter_types text/plain text/xml application/xml;

    # Aviso de privacidad en la misma origen: lo sirve el servicio copiloto. La variable obliga a
    # resolver en cada petición, así Nginx arranca aunque el copiloto aún no esté levantado.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $copiloto_upstream "${COPILOTO_UPSTREAM}";

    location = /privacidad {
        proxy_pass $copiloto_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Estas cabeceras las pone el server; la CSP del copiloto se conserva.
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
    }

    # Hoja de estilos compartida del copiloto, por si el aviso la enlaza con ruta absoluta.
    location ^~ /static/ {
        proxy_pass $copiloto_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
    }

    # API de la demo en la misma origen: con un solo dominio público (túnel o VPS) la cookie de sesión
    # del panel sigue siendo same-site y la consola deja de depender de un segundo host.
    location /api/ {
        proxy_pass $copiloto_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
    }

    # Respaldo para clientes que piden /favicon.ico sin leer el HTML: el mismo ícono SVG.
    location = /favicon.ico {
        try_files /favicon.svg =404;
    }

    location / {
        # $uri.html resuelve /demo → demo.html; $uri/ mantiene "/" → index.html.
        try_files $uri $uri/ $uri.html =404;
    }
}
