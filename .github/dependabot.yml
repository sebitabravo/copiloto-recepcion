version: 2
updates:
  - package-ecosystem: uv
    directory: /copiloto
    schedule: {interval: weekly}
    groups: {python: {patterns: ["*"]}}
  - package-ecosystem: uv
    directory: /pms_mock
    schedule: {interval: weekly}
    groups: {python: {patterns: ["*"]}}
  - package-ecosystem: docker
    directory: /copiloto
    schedule: {interval: weekly}
    ignore:
      # Python 3.13 o superior cambia la matriz de compatibilidad: migrar de forma coordinada y probada
      - dependency-name: python
        versions: [">=3.13"]
  - package-ecosystem: docker
    directory: /pms_mock
    schedule: {interval: weekly}
    ignore:
      - dependency-name: python
        versions: [">=3.13"]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
